VS Code 更新 GitHub 操作路徑：

Ctrl + S → 儲存修改的檔案。

左側工具列 → Source Control（分支圖示） → 開啟 Git 管理。

Changes（變更清單）→ 檔案右側 + → 加入待提交檔案。

Source Control 面板上方 → Message 輸入框 → 填寫版本說明。

Message 下方 → Commit 按鈕 → 提交版本。

Source Control 面板右上角 "..." → Pull, Push → Push → 上傳 GitHub。


簡記：儲存 → 左側 Git → 加入檔案 → 填版本 → Commit → Push
